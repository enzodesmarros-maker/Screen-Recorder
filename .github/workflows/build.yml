name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Screen-Recorder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
